  .tab-switch { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-switch button {
    padding: 10px 14px; font-size: 13px; border-radius: 20px;
    border: 2px solid #16a34a; background: #fff; color: #15803d;
    cursor: pointer; font-weight: 700; transition: .2s; font-family: inherit;

  .tab-switch button.active { background: #16a34a; color: #fff; }
  .progress { color: #888; font-size: 12px; margin-bottom: 10px; }
  .word {
    font-size: 38px; font-weight: bold; color: #15803d;

    word-break: break-word; line-height: 1.15;
  }
  .word.rus-word {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #166534; font-size: 32px;
  }
  .question { font-size: 15px; margin-bottom: 14px; color: #333; font-weight: 600; }
  .options { display: grid; grid-template-columns: 1fr; gap: 8px; }
  button.opt {
    padding: 15px 14px; font-size: 16px; border: 2px solid #16a34a;
    background: #fff; color: #15803d; border-radius: 10px;
    cursor: pointer; transition: all .15s; font-weight: 600;
    font-family: inherit; text-align: center; line-height: 1.3; min-height: 52px;
  }
  button.opt.greek { font-family: 'Times New Roman', serif; font-size: 20px; color: #15803d; }
  button.opt:active:not(:disabled) { background: #16a34a; color: #fff; }
  button.opt:disabled { cursor: default; opacity: .75; }
  button.opt.correct { background: #22c55e !important; color: #fff !important; border-color: #22c55e; }
  button.opt.wrong { background: #ef4444 !important; color: #fff !important; border-color: #ef4444; }
  .feedback { margin-top: 14px; font-size: 16px; font-weight: 700; min-height: 22px; }
  .feedback.ok { color: #22c55e; }
  .feedback.no { color: #ef4444; }
  .info {
    display: none; margin-top: 12px; text-align: left;
    background: #f0fdf4; border-left: 4px solid #16a34a;
    border-radius: 8px; padding: 12px 14px; font-size: 14px;
    color: #333; line-height: 1.55;
  }
  .info.show { display: block; animation: fade .25s ease; }
  @keyframes fade { from {opacity:0; transform: translateY(-4px);} to {opacity:1;} }
  .info .row { margin: 4px 0; }
  .info .lbl { display: inline-block; min-width: 120px; font-weight: 700; color: #15803d; }
  .next {
    margin-top: 14px; background: #86efac; color: #14532d;
    padding: 16px 24px; display: none;
    font-weight: 700; border-radius: 12px; cursor: pointer; border: none;
    font-family: inherit; font-size: 16px; width: 100%; min-height: 52px;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
  }

  .score { margin-top: 12px; font-size: 12.5px; color: #666; }
  @media (max-width: 600px) {
    body { padding: 6px; }
    .card { padding: 14px; border-radius: 12px; }
    h1 { font-size: 17px; }
    .word { font-size: 30px; }

    button.opt { padding: 13px 12px; font-size: 15px; }
    button.opt.greek { font-size: 18px; }
    .info .lbl { min-width: 100px; }

  {word:"τὸ σῶμα", tr:"тело", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ ὄνομα", tr:"имя", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ αἷμα", tr:"кровь", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ πνεῦμα", tr:"дух, дыхание", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ θέλημα", tr:"воля", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ ῥῆμα", tr:"слово, изречение", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ φῶς", tr:"свет", type:"noun", decl:"3", gender:"с", ending:"-ῶς"},
  {word:"τὸ πῦρ", tr:"огонь", type:"noun", decl:"3", gender:"с", ending:"-ῦρ"},
  {word:"τὸ ὕδωρ", tr:"вода", type:"noun", decl:"3", gender:"с", ending:"-ωρ"},
  {word:"τὸ σκότος", tr:"тьма", type:"noun", decl:"3", gender:"с", ending:"-ος"},
  {word:"τὸ ἔλεος", tr:"милость", type:"noun", decl:"3", gender:"с", ending:"-ος"},
  {word:"τὸ γένος", tr:"род", type:"noun", decl:"3", gender:"с", ending:"-ος"},
  {word:"τὸ μέρος", tr:"часть", type:"noun", decl:"3", gender:"с", ending:"-ος"},
  {word:"τὸ τέλος", tr:"конец", type:"noun", decl:"3", gender:"с", ending:"-ος"},
  {word:"τὸ σπέρμα", tr:"семя", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ στόμα", tr:"рот, уста", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ κρίμα", tr:"суд, осуждение", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ βάπτισμα", tr:"крещение", type:"noun", decl:"3", gender:"с", ending:"-μα"},
  {word:"τὸ ἅλας", tr:"соль", type:"noun", decl:"3", gender:"с", ending:"-ας"},
  {word:"τὸ ὄμμα", tr:"глаз, око", type:"noun", decl:"3", gender:"с", ending:"-μα"}
];

/* =========================================================
   СПРАВОЧНИКИ
   ========================================================= */
const declRus = {"1":"1-е склонение","2":"2-е склонение","3":"3-е склонение"};
const genderRus = {"м":"мужской род","ж":"женский род","с":"средний род"};

function buildRule(w) {
  const decl = declRus[w.decl];
  const gender = genderRus[w.gender];
  let stem = "";
  if (w.decl === "1") stem = "основа на -α/η";
  if (w.decl === "2") stem = "основа на -ο";
  if (w.decl === "3") stem = "согласная основа";
  const art = w.word.split(" ")[0];
  return `${decl}, ${gender}, ${stem}. Артикль «${art}» → ${gender}. Окончание «${w.ending}» → ${decl}.`;
}

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let tab = "gr-ru";
let deck = [];
let current = null;
let answered = false;
let score = 0, total = 0;

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck() {
  deck = shuffle(words.slice());
}

function setTab(t) {
  tab = t;
  document.getElementById("tabGrRu").classList.toggle("active", t === "gr-ru");
  document.getElementById("tabRuGr").classList.toggle("active", t === "ru-gr");
  score = 0; total = 0;
  buildDeck();
  nextCard();
}

function nextCard() {
  if (deck.length === 0) buildDeck();
  current = deck.pop();
  answered = false;

  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  const info = document.getElementById("info");
  info.className = "info"; info.innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";

  const wordEl = document.getElementById("word");
  const qEl = document.getElementById("question");
  const box = document.getElementById("options");
  box.innerHTML = "";

  if (tab === "gr-ru") {
    wordEl.textContent = current.word;
    wordEl.className = "word";
    qEl.textContent = "Как переводится это слово?";

    const correct = {key:current.tr, label:current.tr};
    const others = words.filter(w => w.tr !== current.tr);
    const wrong = shuffle(others).slice(0, 3).map(w => ({key:w.tr, label:w.tr}));
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => check(o.key, b, correct.key);
      box.appendChild(b);
    });
  } else {
    wordEl.textContent = current.tr;
    wordEl.className = "word rus-word";
    qEl.textContent = "Как это слово по-гречески?";

    const correct = {key:current.word, label:current.word};
    const others = words.filter(w => w.word !== current.word);
    const wrong = shuffle(others).slice(0, 3).map(w => ({key:w.word, label:w.word}));
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt greek";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => check(o.key, b, correct.key);
      box.appendChild(b);
    });
  }

  document.getElementById("progress").textContent =
    `Вопрос ${total + 1} • Осталось в колоде: ${deck.length}`;
}

function check(choiceKey, btn, correctKey) {
  if (answered) return;
  answered = true; total++;

  const isRight = choiceKey === correctKey;
  const correctBtn = [...document.querySelectorAll("#options button")]
    .find(b => b.dataset.key === correctKey);

  document.querySelectorAll("#options button").forEach(b => {
    b.disabled = true;
    if (b === correctBtn) b.classList.add("correct");
  });

  const fb = document.getElementById("feedback");
  if (isRight) {
    score++;
    fb.textContent = "✅ Верно!";
    fb.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    fb.textContent = `❌ Неверно. Правильно: ${correctBtn.textContent}`;
    fb.className = "feedback no";
  }

  const info = document.getElementById("info");
  info.innerHTML = `
    <div class="row"><span class="lbl">Слово:</span> ${current.word} — «${current.tr}»</div>
    <div class="row"><span class="lbl">Часть речи:</span> существительное</div>
    <div class="row"><span class="lbl">Род:</span> ${genderRus[current.gender]}</div>
    <div class="row"><span class="lbl">Склонение:</span> ${declRus[current.decl]}</div>
    <div class="row"><span class="lbl">Окончание:</span> ${current.ending}</div>
    <div class="row"><span class="lbl">Правило:</span> ${buildRule(current)}</div>
  `;
  info.classList.add("show");

  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("score").textContent = `Счёт: ${score} / ${total}`;
}

buildDeck();
nextCard();
</script>
</body>
</html>
