  const type = typeRus[w.type] || "слово";
  if (w.type === "adj") {
    if (w.decl === "1") return `Прилагательное 1-го склонения (ж.р.). Согласуется с сущ. ж.р.`;
    if (w.decl === "2") return `Прилагательное 2-го склонения (${genderRus[w.gender]}). Согласуется с сущ.`;
    if (w.decl === "3") return `Прилагательное 3-го склонения. Особая парадигма.`;
  }
  if (w.type === "pron") return `Местоимение. Склоняется по падежам и числам.`;
  if (w.type === "adv") return `Наречие — неизменяемая часть речи.`;
  if (w.type === "prep") return `Предлог. Управляет определённым падежом.`;
  if (w.type === "conj") return `Союз или частица. Не склоняется и не спрягается.`;
  if (w.type === "num") return `Числительное.`;
  return `${type}. Служебное слово.`;
}

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let tab = "gr-ru";
let deck = [];
let current = null;
let answered = false;
let score = 0, total = 0;

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck() {
  deck = shuffle(words.slice());
}

function setTab(t) {
  tab = t;
  document.getElementById("tabGrRu").classList.toggle("active", t === "gr-ru");
  document.getElementById("tabRuGr").classList.toggle("active", t === "ru-gr");
  score = 0; total = 0;
  buildDeck();
  nextCard();
}

function nextCard() {
  if (deck.length === 0) buildDeck();
  current = deck.pop();
  answered = false;

  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  const info = document.getElementById("info");
  info.className = "info"; info.innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";

  const wordEl = document.getElementById("word");
  const qEl = document.getElementById("question");
  const box = document.getElementById("options");
  box.innerHTML = "";

  if (tab === "gr-ru") {
    wordEl.textContent = current.word;
    wordEl.className = "word";
    qEl.textContent = "Как переводится это слово?";

    const correct = {key:current.tr, label:current.tr};
    const others = words.filter(w => w.tr !== current.tr);
    const wrong = shuffle(others).slice(0, 3).map(w => ({key:w.tr, label:w.tr}));
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => check(o.key, b, correct.key);
      box.appendChild(b);
    });
  } else {
    wordEl.textContent = current.tr;
    wordEl.className = "word rus-word";
    qEl.textContent = "Как это по-гречески?";

    const correct = {key:current.word, label:current.word};
    const others = words.filter(w => w.word !== current.word);
    const wrong = shuffle(others).slice(0, 3).map(w => ({key:w.word, label:w.word}));
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt greek";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => check(o.key, b, correct.key);
      box.appendChild(b);
    });
  }

  document.getElementById("progress").textContent =
    `Вопрос ${total + 1} • Осталось в колоде: ${deck.length}`;
}

function check(choiceKey, btn, correctKey) {
  if (answered) return;
  answered = true; total++;

  const isRight = choiceKey === correctKey;
  const correctBtn = [...document.querySelectorAll("#options button")]
    .find(b => b.dataset.key === correctKey);

  document.querySelectorAll("#options button").forEach(b => {
    b.disabled = true;
    if (b === correctBtn) b.classList.add("correct");
  });

  const fb = document.getElementById("feedback");
  if (isRight) {
    score++;
    fb.textContent = "✅ Верно!";
    fb.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    fb.textContent = `❌ Неверно. Правильно: ${correctBtn.textContent}`;
    fb.className = "feedback no";
  }

  const info = document.getElementById("info");
  let html = `
    <div class="row"><span class="lbl">Слово:</span> ${current.word} — «${current.tr}»</div>
    <div class="row"><span class="lbl">Часть речи:</span> ${typeRus[current.type] || "слово"}</div>
  `;
  if (current.type === "adj") {
    html += `
      <div class="row"><span class="lbl">Род:</span> ${genderRus[current.gender]}</div>
      <div class="row"><span class="lbl">Склонение:</span> ${declRus[current.decl] || "—"}</div>
    `;
  }
  html += `<div class="row"><span class="lbl">Правило:</span> ${buildRule(current)}</div>`;
  info.innerHTML = html;
  info.classList.add("show");

  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("score").textContent = `Счёт: ${score} / ${total}`;
}

buildDeck();
nextCard();
</script>
