<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Греческий тренажёр — Новый Завет</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    min-height: 100vh; margin: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 30px;
    max-width: 820px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    text-align: center;
  }
  h1 { margin: 0 0 6px; color: #1a2a6c; font-size: 23px; }
  .subtitle { color: #888; font-size: 12px; margin-bottom: 10px; letter-spacing: .5px; }
  .mode-switch { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
  .mode-switch button {
    padding: 8px 14px; font-size: 12.5px; border-radius: 20px;
    border: 2px solid #1a2a6c; background: #fff; color: #1a2a6c;
    cursor: pointer; font-weight: 700; transition: .2s;
  }
  .mode-switch button.active { background: #1a2a6c; color: #fff; }
  .progress { color: #888; font-size: 13px; margin-bottom: 10px; }
  .type-badge {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .type-badge.noun { background: #e8f0ff; color: #1a2a6c; }
  .type-badge.verb { background: #ffe8e8; color: #b21f1f; }
  .type-badge.tense { background: #fff3d6; color: #8a5a00; }
  .type-badge.imp { background: #e8ffe8; color: #1a7a2e; }
  .word {
    font-size: 40px; font-weight: bold; color: #b21f1f;
    margin: 10px 0 5px; font-family: 'Times New Roman', serif;
    word-break: break-word;
  }
  .word.verb-word { color: #1a2a6c; }
  .translation { color: #666; font-size: 15px; margin-bottom: 20px; font-style: italic; }
  .question { font-size: 16.5px; margin-bottom: 15px; color: #333; font-weight: 600; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.opt {
    padding: 12px; font-size: 14.5px; border: 2px solid #1a2a6c;
    background: #fff; color: #1a2a6c; border-radius: 10px;
    cursor: pointer; transition: all .2s; font-weight: 600;
    font-family: inherit;
  }
  button.opt:hover:not(:disabled) { background: #1a2a6c; color: #fff; }
  button.opt:disabled { cursor: default; opacity: .75; }
  button.opt.correct { background: #2ecc71 !important; color: #fff !important; border-color: #2ecc71; }
  button.opt.wrong { background: #e74c3c !important; color: #fff !important; border-color: #e74c3c; }
  .feedback { margin-top: 16px; font-size: 17px; font-weight: 700; min-height: 24px; }
  .feedback.ok { color: #2ecc71; }
  .feedback.no { color: #e74c3c; }
  .explanation {
    display: none; margin-top: 14px; text-align: left;
    background: #f4f6fb; border-left: 5px solid #1a2a6c;
    border-radius: 10px; padding: 16px 20px; font-size: 14.5px;
    color: #333; line-height: 1.55;
  }
  .explanation.show { display: block; animation: fade .3s ease; }
  @keyframes fade { from {opacity:0; transform: translateY(-5px);} to {opacity:1;} }
  .explanation h3 { margin: 0 0 8px; color: #1a2a6c; font-size: 15px; }
  .explanation .row { margin: 5px 0; }
  .explanation .label { display: inline-block; min-width: 150px; font-weight: 700; color: #b21f1f; }
  .explanation .example {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #bbb;
    font-style: italic; color: #555; font-size: 13.5px;
  }
  .paradigm {
    margin-top: 8px; padding: 10px 12px; background: #fff;
    border-radius: 6px; font-family: 'Times New Roman', serif;
    font-size: 13.5px; line-height: 1.7; color: #333;
  }
  .paradigm b { color: #1a2a6c; }
  .paradigm .tblock { margin-bottom: 8px; }
  .paradigm .tname { color: #8a5a00; font-weight: 700; font-style: italic; }
  .next {
    margin-top: 15px; background: #fdbb2d; color: #1a2a6c;
    padding: 11px 28px; display: none;
    font-weight: 700; border-radius: 10px; cursor: pointer; border: none;
    font-family: inherit; font-size: 15px;
  }
  .next:hover { background: #e0a020 !important; }
  .score { margin-top: 15px; font-size: 13px; color: #666; }
</style>
</head>

<div class="card">

  <div class="explanation" id="explanation"></div>
  <button class="next" id="nextBtn" onclick="nextCard()">Дальше →</button>
  <div class="score" id="score"></div>
</div>

function declineRussian(tr, decl, gender, caseKey) {
  if (irregularRu[tr]) {
    return irregularRu[tr][caseKey] || tr;
  }
  const last = tr.slice(-1);
  const stem = tr.slice(0, -1);

  if (gender === "ж" && (last === "а" || last === "я")) {
    const base = stem;
    return {
      nom: tr,
      gen: base + (last === "а" ? "ы" : "и"),
      dat: base + "е",
      acc: base + (last === "а" ? "у" : "ю"),
      voc: tr
    }[caseKey] || tr;
  }
  if (gender === "ж" && last === "ь") {
    const base = stem;
    return {nom: tr, gen: base + "и", dat: base + "и", acc: tr, voc: tr}[caseKey] || tr;
  }
  if (gender === "м" && (last === "а" || last === "я")) {
    const base = stem;
    return {
      nom: tr,
      gen: base + (last === "а" ? "ы" : "и"),
      dat: base + "е",
      acc: base + (last === "а" ? "у" : "ю"),
      voc: tr
    }[caseKey] || tr;
  }
  if (gender === "м") {
    return {nom: tr, gen: tr + "а", dat: tr + "у", acc: tr + "а", voc: tr}[caseKey] || tr;
  }
  if (gender === "с" && (last === "о" || last === "е")) {
    const base = stem;
    return {nom: tr, gen: base + "а", dat: base + "у", acc: tr, voc: tr}[caseKey] || tr;
  }
  return tr;
}

function translateVerbForm(tense, person, d) {
  const idx = personIdx[person];
  const pron = personPron[person];

  if (tense === "praes") {
    const m = d.tenses.praes.ru.match(/«([^»]+)»/);
    let base1s = m ? m[1].replace(/^я /, "") : "…";
    if (presPairs[base1s]) return `${pron} ${presPairs[base1s][idx]}`;
    return `${pron} ${base1s}`;
  }
  if (tense === "impf") {
    const m = d.tenses.impf.ru.match(/«([^»]+)»/);
    let base1s = m ? m[1].replace(/^я /, "") : "…";
    if (impfPairs[base1s]) return `${pron} ${impfPairs[base1s][idx]}`;
    return `${pron} ${base1s}`;
  }
  if (tense === "aor") {
    const base = aor1s[d.word] || "…";
    return `${pron} ${base}`;
  }
  const base = perf1s[d.word] || "…";
  return `${pron} ${base}`;
}

let mode = "class";
let deck = [];
let current = null;
let answered = false;
let score = 0, total = 0;

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* =========================================================
   СБОРКА КОЛОДЫ
   ========================================================= */
function buildDeck() {
  deck = [];
  if (mode === "class") {
    nouns.forEach(n => deck.push({kind:"class", data:n, type:"noun"}));
    verbs.forEach(v => deck.push({kind:"class", data:v, type:"verb"}));
  } else if (mode === "form") {
    nouns.forEach(n => {
      ["nom","gen","dat","acc","voc"].forEach(c => {
        deck.push({kind:"form", data:n, type:"noun", key:c});
      });
    });
    verbs.forEach(v => {
      ["1s","2s","3s","1p","2p","3p"].forEach(p => {
        deck.push({kind:"form", data:v, type:"verb", key:p});
      });
    });
  } else if (mode === "tense") {
    verbs.forEach(v => {
      Object.keys(v.tenses).forEach(t => {
        ["1s","2s","3s","1p","2p","3p"].forEach(p => {
          if (v.tenses[t].forms[p] && v.tenses[t].forms[p] !== "—") {
            deck.push({kind:"tense", data:v, tense:t, person:p});
          }
        });
      });
    });
  } else { // imp
    verbs.forEach(v => {
      if (!v.imperatives) return;
      Object.keys(v.imperatives).forEach(t => {
        Object.keys(v.imperatives[t]).forEach(p => {
          if (v.imperatives[t][p]) {
            deck.push({kind:"imp", data:v, tense:t, person:p});
          }
        });
      });
    });
  }
  deck = shuffle(deck);
}

function setMode(m) {
  mode = m;
  document.getElementById("modeClassBtn").classList.toggle("active", m === "class");
  document.getElementById("modeFormBtn").classList.toggle("active", m === "form");
  document.getElementById("modeTenseBtn").classList.toggle("active", m === "tense");
  document.getElementById("modeImpBtn").classList.toggle("active", m === "imp");
  buildDeck();
  nextCard();
}

/* =========================================================
   СЛЕДУЮЩАЯ КАРТОЧКА
   ========================================================= */
function nextCard() {
  if (deck.length === 0) buildDeck();
  current = deck.pop();
  answered = false;

  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  const expl = document.getElementById("explanation");
  expl.className = "explanation"; expl.innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";

  const badge = document.getElementById("badge");
  const wordEl = document.getElementById("word");
  const trEl = document.getElementById("translation");
  const qEl = document.getElementById("question");
  const box = document.getElementById("options");
  box.innerHTML = "";

  const d = current.data;
  const isVerb = current.type === "verb" || current.kind === "tense" || current.kind === "imp";

  if (current.kind === "class") {
    badge.innerHTML = `<span class="type-badge ${isVerb?'verb':'noun'}">${isVerb?'ГЛАГОЛ':'СУЩЕСТВИТЕЛЬНОЕ'}</span>`;
    wordEl.textContent = d.word;
    wordEl.className = "word" + (isVerb ? " verb-word" : "");
    trEl.textContent = "— " + d.tr;
    qEl.textContent = isVerb
      ? "К какому спряжению относится этот глагол?"
      : "К какому склонению и роду относится это слово?";

    let opts, correct;
    if (isVerb) {
      opts = [
        {key:"1", label:conjRus["1"]},
        {key:"2", label:conjRus["2"]},
        {key:"3", label:conjRus["3"]},
      ];
      correct = opts.find(o => o.key === d.conj);
    } else {
      opts = [
        {key:"1|ж", label:"1 скл., женский"},
        {key:"1|м", label:"1 скл., мужской"},
        {key:"2|м", label:"2 скл., мужской"},
        {key:"2|с", label:"2 скл., средний"},
        {key:"3|м", label:"3 скл., мужской"},
        {key:"3|ж", label:"3 скл., женский"},
        {key:"3|с", label:"3 скл., средний"},
      ];
      correct = opts.find(o => o.key === d.decl + "|" + d.gender);
    }
    const wrong = shuffle(opts.filter(o => o !== correct)).slice(0, 3);
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => checkClass(o.key, b, correct.key, isVerb);
      box.appendChild(b);
    });
  } else if (current.kind === "form") {
    const key = current.key;
    if (isVerb) {
      wordEl.textContent = d.tenses.praes.forms[key];
      wordEl.className = "word verb-word";
      trEl.textContent = `— от глагола ${d.word} («${d.tr}»)`;
      qEl.textContent = "Какое это лицо и число? (praes. ind. act.)";
    } else {
      wordEl.textContent = d.forms[key];
      wordEl.className = "word";
      trEl.textContent = `— от слова ${d.word} («${d.tr}»)`;
      qEl.textContent = "Какой это падеж? (единственное число)";
    }

    let opts, correct;
    if (isVerb) {
      opts = [
        {key:"1s", label:personRus["1s"]},
        {key:"2s", label:personRus["2s"]},
        {key:"3s", label:personRus["3s"]},
        {key:"1p", label:personRus["1p"]},
        {key:"2p", label:personRus["2p"]},
        {key:"3p", label:personRus["3p"]},
      ];
      correct = opts.find(o => o.key === key);
    } else {
      opts = [
        {key:"nom", label:caseRus.nom + " (Nom.)"},
        {key:"gen", label:caseRus.gen + " (Gen.)"},
        {key:"dat", label:caseRus.dat + " (Dat.)"},
        {key:"acc", label:caseRus.acc + " (Acc.)"},
        {key:"voc", label:caseRus.voc + " (Voc.)"},
      ];
      correct = opts.find(o => o.key === key);
    }
    const wrong = shuffle(opts.filter(o => o !== correct)).slice(0, 3);
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => checkForm(o.key, b, correct.key, isVerb);
      box.appendChild(b);
    });
  } else if (current.kind === "tense") {
    badge.innerHTML = `<span class="type-badge tense">ВРЕМЯ ГЛАГОЛА</span>`;
    const form = d.tenses[current.tense].forms[current.person];
    wordEl.textContent = form;
    wordEl.className = "word verb-word";
    trEl.textContent = `— от глагола ${d.word} («${d.tr}»)`;
    qEl.textContent = "Какое это время, лицо и число? (ind. act.)";

    const correctKey = current.tense + "|" + current.person;
    const allTenses = ["praes","impf","aor","perf"];
    const allPersons = ["1s","2s","3s","1p","2p","3p"];
    const allOptions = [];
    allTenses.forEach(t => {
      if (!d.tenses[t]) return;
      allPersons.forEach(p => {
        if (!d.tenses[t].forms[p] || d.tenses[t].forms[p] === "—") return;
        allOptions.push({
          key: t + "|" + p,
          label: tenseRus[t] + ", " + personRus[p]
        });
      });
    });
    const correct = allOptions.find(o => o.key === correctKey);
    const wrong = shuffle(allOptions.filter(o => o.key !== correctKey)).slice(0, 3);
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => checkTense(o.key, b, correctKey);
      box.appendChild(b);
    });
  } else { // imp
    badge.innerHTML = `<span class="type-badge imp">ИМПЕРАТИВ</span>`;
    const form = d.imperatives[current.tense][current.person];
    wordEl.textContent = form;
    wordEl.className = "word verb-word";
    trEl.textContent = `— от глагола ${d.word} («${d.tr}»)`;
    qEl.textContent = "Какое это время, лицо и число? (повелительное наклонение)";

    const correctKey = current.tense + "|" + current.person;
    const allOptions = [];
    ["praes","aor"].forEach(t => {
      if (!d.imperatives[t]) return;
      ["2s","2p","3s","3p"].forEach(p => {
        if (!d.imperatives[t][p]) return;
        allOptions.push({
          key: t + "|" + p,
          label: impRus[t + "|" + p]
        });
      });
    });
    const correct = allOptions.find(o => o.key === correctKey);
    const wrong = shuffle(allOptions.filter(o => o.key !== correctKey)).slice(0, 3);
    const shown = shuffle([correct, ...wrong]);

    shown.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = o.label;
      b.dataset.key = o.key;
      b.onclick = () => checkImp(o.key, b, correctKey);
      box.appendChild(b);
    });
  }

  document.getElementById("progress").textContent =
    `Слово ${total + 1} • В колоде: ${deck.length}`;
}

/* =========================================================
   ПРОВЕРКА
   ========================================================= */
function checkClass(choiceKey, btn, correctKey, isVerb) {
  if (answered) return;
  answered = true; total++;
  finishAnswer(choiceKey, btn, correctKey);
  renderClassExplanation(current.data, isVerb);
  finalize();
}

function checkForm(choiceKey, btn, correctKey, isVerb) {
  if (answered) return;
  answered = true; total++;
  finishAnswer(choiceKey, btn, correctKey);
  renderFormExplanation(current.data, isVerb, current.key);
  finalize();
}

function checkTense(choiceKey, btn, correctKey) {
  if (answered) return;
  answered = true; total++;
  finishAnswer(choiceKey, btn, correctKey);
  renderTenseExplanation(current.data, current.tense, current.person);
  finalize();
}

function checkImp(choiceKey, btn, correctKey) {
  if (answered) return;
  answered = true; total++;
  finishAnswer(choiceKey, btn, correctKey);
  renderImpExplanation(current.data, current.tense, current.person);
  finalize();
}

function finishAnswer(choiceKey, btn, correctKey) {
  const isRight = choiceKey === correctKey;
  const correctBtn = [...document.querySelectorAll("#options button")]
    .find(b => b.dataset.key === correctKey);
  document.querySelectorAll("#options button").forEach(b => {
    b.disabled = true;
    if (b === correctBtn) b.classList.add("correct");
  });
  const fb = document.getElementById("feedback");
  if (isRight) {
    score++;
    fb.textContent = "✅ Верно!";
    fb.className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    fb.textContent = `❌ Неверно. Правильно: ${correctBtn.textContent}`;
    fb.className = "feedback no";
  }
}

function finalize() {
  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("score").textContent = `Счёт: ${score} / ${total}`;
  document.getElementById("explanation").classList.add("show");
}

/* =========================================================
   ОБЪЯСНЕНИЯ
   ========================================================= */
function renderClassExplanation(d, isVerb) {
  const expl = document.getElementById("explanation");
  if (isVerb) {
    expl.innerHTML = `
      <h3>📖 Разбор глагола</h3>
      <div class="row"><span class="label">Инфинитив:</span> ${d.word} (${d.tr})</div>
      <div class="row"><span class="label">Спряжение:</span> ${conjRus[d.conj]}</div>
      <div class="row"><span class="label">Почему:</span> ${d.rule}</div>
      <div class="example">💡 ${d.example}</div>
      <div class="paradigm">${renderAllTenses(d.tenses, null, d)}</div>
      <div class="paradigm">${renderImperatives(d.imperatives, null, d)}</div>
    `;
  } else {
    expl.innerHTML = `
      <h3>📖 Разбор существительного</h3>
      <div class="row"><span class="label">Слово:</span> ${d.word} (${d.tr})</div>
      <div class="row"><span class="label">Артикль:</span> ${d.word.split(" ")[0]} → ${genderRus[d.gender]}</div>
      <div class="row"><span class="label">Окончание:</span> ${d.ending}</div>
      <div class="row"><span class="label">Склонение:</span> ${declRus[d.decl]}, ${genderRus[d.gender]}</div>
      <div class="row"><span class="label">Почему:</span> ${d.rule}</div>
      <div class="example">💡 ${d.example}</div>
      <div class="paradigm">${renderNounParadigm(d.forms, null, d)}</div>
    `;
  }
}

function renderFormExplanation(d, isVerb, key) {
  const expl = document.getElementById("explanation");
  if (isVerb) {
    expl.innerHTML = `
      <h3>📖 Разбор формы глагола (praes.)</h3>
      <div class="row"><span class="label">Форма:</span> ${d.tenses.praes.forms[key]}</div>
      <div class="row"><span class="label">Перевод:</span> «${translateVerbForm("praes", key, d)}»</div>
      <div class="row"><span class="label">Инфинитив:</span> ${d.word} («${d.tr}»)</div>
      <div class="row"><span class="label">Спряжение:</span> ${conjRus[d.conj]}</div>
      <div class="row"><span class="label">Грамм. значение:</span> ${personRus[key]}, praes. ind. act.</div>
      <div class="row"><span class="label">Почему:</span> ${explainVerbPerson(key)}</div>
      <div class="example">💡 ${d.example}</div>
      <div class="paradigm">${renderVerbParadigm(d.tenses.praes.forms, key, d)}</div>
    `;
  } else {
    const rusWord = declineRussian(d.tr, d.decl, d.gender, key);
    expl.innerHTML = `
      <h3>📖 Разбор падежной формы</h3>
      <div class="row"><span class="label">Форма:</span> ${d.forms[key]}</div>
      <div class="row"><span class="label">Перевод:</span> «${rusWord}»</div>
      <div class="row"><span class="label">Им. падеж:</span> ${d.word} («${d.tr}»)</div>
      <div class="row"><span class="label">Склонение:</span> ${declRus[d.decl]}, ${genderRus[d.gender]}</div>
      <div class="row"><span class="label">Падеж:</span> ${caseRus[key]} (${caseShort[key]})</div>
      <div class="row"><span class="label">Почему:</span> ${explainNounCase(d, key)}</div>
      <div class="example">💡 ${d.example}</div>
      <div class="paradigm">${renderNounParadigm(d.forms, key, d)}</div>
    `;
  }
}

function renderTenseExplanation(d, tense, person) {
  const expl = document.getElementById("explanation");
  const form = d.tenses[tense].forms[person];
  const combined = tense + "|" + person;
  expl.innerHTML = `
    <h3>📖 Разбор временной формы</h3>
    <div class="row"><span class="label">Форма:</span> ${form}</div>
    <div class="row"><span class="label">Перевод:</span> «${translateVerbForm(tense, person, d)}»</div>
    <div class="row"><span class="label">Инфинитив:</span> ${d.word} («${d.tr}»)</div>
    <div class="row"><span class="label">Спряжение:</span> ${conjRus[d.conj]}</div>
    <div class="row"><span class="label">Время:</span> ${tenseRus[tense]} — ${d.tenses[tense].ru}</div>
    <div class="row"><span class="label">Лицо/число:</span> ${personRus[person]}</div>
    <div class="row"><span class="label">Почему:</span> ${explainTenseForm(tense, person)}</div>
    <div class="example">💡 ${d.example}</div>
    <div class="paradigm">${renderAllTenses(d.tenses, combined, d)}</div>
  `;
}

function renderImpExplanation(d, tense, person) {
  const expl = document.getElementById("explanation");
  const form = d.imperatives[tense][person];
  const combined = tense + "|" + person;
  expl.innerHTML = `
    <h3>📖 Разбор императива</h3>
    <div class="row"><span class="label">Форма:</span> ${form}</div>
    <div class="row"><span class="label">Значение:</span> ${impRus[combined]}</div>
    <div class="row"><span class="label">Инфинитив:</span> ${d.word} («${d.tr}»)</div>
    <div class="row"><span class="label">Спряжение:</span> ${conjRus[d.conj]}</div>
    <div class="row"><span class="label">Почему:</span> ${explainImpForm(tense, person)}</div>
    <div class="example">💡 ${d.example}</div>
    <div class="paradigm">${renderImperatives(d.imperatives, combined, d)}</div>
  `;
}

/* =========================================================
   ПАРАДИГМЫ
   ========================================================= */
function renderNounParadigm(forms, highlight, d) {
  const rows = [
    ["Nom.", "nom", forms.nom],
    ["Gen.", "gen", forms.gen],
    ["Dat.", "dat", forms.dat],
    ["Acc.", "acc", forms.acc],
    ["Voc.", "voc", forms.voc],
  ];
  return "<b>Парадигма ед. ч. (с переводом):</b><br>" + rows.map(([lbl,k,val]) => {
    let rusWord = "—";
    if (d) rusWord = declineRussian(d.tr, d.decl, d.gender, k);
    const info = caseRu[k];
    const line = `${lbl} ${val} — «${rusWord}» (${info.short}. ${info.q})`;
    return (k === highlight ? `<b>▸ ${line}</b>` : line);
  }).join("<br>");
}

function renderVerbParadigm(forms, highlight, d) {
  const rows = [
    ["1 sg.", "1s", forms["1s"]],
    ["2 sg.", "2s", forms["2s"]],
    ["3 sg.", "3s", forms["3s"]],
    ["1 pl.", "1p", forms["1p"]],
    ["2 pl.", "2p", forms["2p"]],
    ["3 pl.", "3p", forms["3p"]],
  ];
  return "<b>Praes. ind. act. (с переводом):</b><br>" + rows.map(([lbl,k,val]) => {
    const ru = d ? translateVerbForm("praes", k, d) : "";
    const line = `${lbl} ${val} — «${ru}»`;
    return (k === highlight ? `<b>▸ ${line}</b>` : line);
  }).join("<br>");
}

function renderAllTenses(tenses, highlightKey, d) {
  const order = ["praes","impf","aor","perf"];
  let html = "<b>Все времена (ind. act.) с переводом:</b><br>";
  order.forEach(t => {
    if (!tenses[t]) return;
    html += `<div class="tblock"><span class="tname">${tenseRus[t]}</span> — ${tenses[t].ru}<br>`;
    ["1s","2s","3s","1p","2p","3p"].forEach(p => {
      const combined = t + "|" + p;
      const val = tenses[t].forms[p];
      if (val === "—") return;
      const ru = d ? translateVerbForm(t, p, d) : "";
      const line = `${p} ${val} — «${ru}»`;
      if (combined === highlightKey) {
        html += `<b>▸ ${line}</b><br>`;
      } else {
        html += `${line}<br>`;
      }
    });
    html += "</div>";
  });
  return html;
}

function renderImperatives(imps, highlightKey, d) {
  if (!imps) return "";
  let html = "<b>Императив (повелительное наклонение):</b><br>";
  ["praes","aor"].forEach(t => {
    if (!imps[t]) return;
    const tname = t === "praes" ? "Praesens imper. — делай (постоянно)" : "Aoristus imper. — сделай (один раз)";
    html += `<div class="tblock"><span class="tname">${tname}</span><br>`;
    ["2s","2p","3s","3p"].forEach(p => {
      const val = imps[t][p];
      if (!val) return;
      const combined = t + "|" + p;
      const line = `${p} ${val} — ${impRus[combined]}`;
      if (combined === highlightKey) {
        html += `<b>▸ ${line}</b><br>`;
      } else {
        html += `${line}<br>`;
      }
    });
    html += "</div>";
  });
  return html;
}

/* =========================================================
   ГРАММАТИЧЕСКИЕ ПОЯСНЕНИЯ
   ========================================================= */
function explainNounCase(d, c) {
  const stem = {"1":"основа на -α/η","2":"основа на -ο","3":"согласная основа"}[d.decl];
  const rules = {
    nom: "Именительный (Nom.) — субъект действия, подлежащее. «кто? что?».",
    gen: `Родительный (Gen.) — принадлежность, происхождение, часть целого. «кого? чего? чей?». ${d.decl}-е скл., ${stem}. Gen. sg. = ${d.forms.gen}.`,
    dat: `Дательный (Dat.) — многозначный падеж: адресат, инструмент, место, время. «кому? чему? чем? где? когда?». Dat. sg. = ${d.forms.dat}.`,
    acc: `Винительный (Acc.) — прямой объект, направление, длительность. «кого? что? куда?». Acc. sg. = ${d.forms.acc}.`,
    voc: `Звательный (Voc.) — обращение. «о …!». Voc. sg. = ${d.forms.voc}.`
  };
  return rules[c];
}

function explainVerbPerson(p) {
  const endings = {
    "1s":"-ω / -μι (я)", "2s":"-εις / -ς (ты)", "3s":"-ει / -σι(ν) (он/она/оно)",
    "1p":"-ομεν / -μεν (мы)", "2p":"-ετε / -τε (вы)", "3p":"-ουσι(ν) / -ασι(ν) (они)"
  };
  return `Личная форма: окончание ${endings[p]}.`;
}

function explainTenseForm(tense, person) {
  const tenseExpl = {
    praes: "Настоящее время — действие происходит сейчас.",
    impf: "Имперфект — прошедшее длительное. Приращение ἐ- + вторичные окончания.",
    aor: "Аорист — прошедшее точечное (однократное действие).",
    perf: "Перфект — прошедшее с результатом в настоящем. Удвоение + окончания -κα."
  };
  const personHint = {
    "1s":"1 л. ед. ч. — «я».", "2s":"2 л. ед. ч. — «ты».",
    "3s":"3 л. ед. ч. — «он/она/оно».", "1p":"1 л. мн. ч. — «мы».",
    "2p":"2 л. мн. ч. — «вы».", "3p":"3 л. мн. ч. — «они»."
  };
  return tenseExpl[tense] + " " + personHint[person];
}

function explainImpForm(tense, person) {
  const tenseExpl = {
    praes: "Praesens imperativi — приказ делать что-то постоянно, продолжать действие. «Делай всегда».",
    aor: "Aoristus imperativi — приказ сделать что-то один раз, конкретное действие. «Сделай сейчас»."
  };
  const personHint = {
    "2s":"2 л. ед. ч. — обращение к одному человеку («ты»).",
    "2p":"2 л. мн. ч. — обращение к нескольким («вы»).",
    "3s":"3 л. ед. ч. — пожелание о третьем лице: «пусть он…».",
    "3p":"3 л. мн. ч. — пожелание о третьих лицах: «пусть они…»."
  };
  return tenseExpl[tense] + " " + personHint[person];
}
